# Configuración Nginx para Control de Acceso Anviz CrossChex en Ubuntu Server
server {
    listen 80;
    server_name control-acceso.empresa.local; # Reemplazar con el dominio o IP de Ubuntu

    # Raíz del Frontend (Vite build / dist)
    root /var/www/control-acceso-crosschex/frontend/dist;
    index index.html;

    # Compresión gzip para alta velocidad
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;

    # Proxy inverso seguro hacia el Backend Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 15M;
    }

    # Servir Frontend SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloqueo de acceso a archivos ocultos o de configuración
    location ~ /\. {
        deny all;
    }
}
