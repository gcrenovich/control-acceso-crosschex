# ==============================================================================
# Configuración Apache 2.4 para Control de Acceso Anviz CrossChex en Ubuntu
# ==============================================================================
# Requiere los siguientes módulos habilitados en Apache:
#   sudo a2enmod proxy proxy_http rewrite headers
# ==============================================================================

<VirtualHost *:80>
    ServerName 10.0.0.10
    # Alternativamente, si tienes un dominio local:
    # ServerName control-acceso.empresa.local

    # 1. Frontend compilado (React + Vite SPA)
    DocumentRoot /var/www/control-acceso-crosschex/frontend/dist

    # 1.1 Preservar el acceso al portal institucional irg-portal
    Alias /irg-portal /home/admin-irg/sistemas/irg-portal
    <Directory /home/admin-irg/sistemas/irg-portal>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/control-acceso-crosschex/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Soporte para rutas de React Router (Single Page Application)
        FallbackResource /index.html
    </Directory>

    # 2. Configuración de Proxy Inverso hacia el Backend Node.js (Puerto 3005)
    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy *>
        Require all granted
    </Proxy>

    # Redirigir todas las peticiones /api hacia el servidor Node.js
    ProxyPass /api http://127.0.0.1:3005/api
    ProxyPassReverse /api http://127.0.0.1:3005/api

    # 3. Ajustes de rendimiento y límite de payload (para transferencias de datos grandes)
    LimitRequestBody 52428800

    # 4. Logs específicos del sistema
    ErrorLog ${APACHE_LOG_DIR}/control-acceso-error.log
    CustomLog ${APACHE_LOG_DIR}/control-acceso-access.log combined
</VirtualHost>
